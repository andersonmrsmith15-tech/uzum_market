<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elektro Market — elektr qurilmalari do'koni</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <a href="#" class="logo">⚡ Elektro<b>Market</b></a>
    <input id="search" type="search" placeholder="Qurilma qidirish…" />
    <button id="cartBtn" class="cart-btn">🛒 Savatcha <span id="cartCount">0</span></button>
  </header>

  <nav id="cats" class="cats"></nav>

  <main>
    <div class="toolbar">
      <span id="resultInfo"></span>
      <select id="sort">
        <option value="">Saralash</option>
        <option value="price-asc">Arzonroq</option>
        <option value="price-desc">Qimmatroq</option>
        <option value="rating">Reyting</option>
      </select>
    </div>
    <div id="grid" class="grid"><p class="muted">Yuklanmoqda…</p></div>
  </main>

  <!-- Mahsulot oynasi -->
  <dialog id="productModal" class="modal"><div id="productBody"></div></dialog>

  <!-- Savatcha -->
  <aside id="cart" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Savatcha</h2>
      <button id="closeCart" class="icon">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-foot">
      <div class="total">Jami: <b id="cartTotal">$0.00</b></div>
      <button id="checkoutBtn" class="primary wide">To'lovga o'tish</button>
      <p id="checkoutErr" class="err"></p>
    </div>
  </aside>
  <div id="overlay" class="overlay"></div>

  <!-- To'lov oynasi (Fake Click Pay) -->
  <dialog id="payModal" class="modal pay-modal">
    <div class="pay">
      <button class="icon close" id="payClose" type="button">✕</button>

      <form id="cardStep" class="pay-step">
        <h2>Karta orqali to'lash</h2>
        <div class="pay-sum"><span class="muted">To'lov summasi</span><b id="paySum">—</b><span id="paySumUsd" class="muted"></span></div>
        <label>Karta raqami
          <input id="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="8600 0000 0000 0000" maxlength="19" required />
        </label>
        <label>Amal qilish muddati
          <input id="cardExpiry" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" required />
        </label>
        <p class="err" id="cardErr"></p>
        <button class="primary wide" id="payBtn">Davom etish</button>
        <p class="muted center">🔒 Karta ma'lumotlari do'konda saqlanmaydi</p>
      </form>

      <form id="otpStep" class="pay-step" hidden>
        <h2>SMS kodni kiriting</h2>
        <p class="muted"><span id="otpCard"></span> kartasiga bog'langan raqamga 6 xonali kod yuborildi</p>
        <div id="demoOtp" class="demo-otp" hidden></div>
        <input id="otpInput" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required />
        <p class="err" id="otpErr"></p>
        <button class="primary wide" id="otpBtn">Tasdiqlash va to'lash</button>
        <div class="pay-links">
          <button type="button" class="link" id="resendBtn">Kodni qayta yuborish</button>
          <button type="button" class="link" id="backBtn">← Boshqa karta</button>
        </div>
      </form>
    </div>
  </dialog>

  <footer>© Elektro Market · Ma'lumotlar: dummyjson.com</footer>
  <script src="app.js"></script>
</body>
</html>
