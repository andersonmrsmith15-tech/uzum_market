<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To'lov natijasi — Elektro Market</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .box { max-width: 480px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 32px; text-align: center; }
    .box h1 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">Tekshirilmoqda…</h1>
    <p id="msg" class="muted"></p>
    <a href="/" class="primary" style="display:inline-block;text-decoration:none;margin-top:12px">Do'konga qaytish</a>
  </div>
  <script>
    const id = new URLSearchParams(location.search).get("session_id");
    fetch("/api/session/" + encodeURIComponent(id || ""))
      .then((r) => r.json())
      .then((d) => {
        if (d.status === "paid") {
          localStorage.removeItem("cart");
          document.getElementById("title").textContent = "✅ To'lov muvaffaqiyatli!";
          document.getElementById("msg").textContent =
            `Summa: ${(d.amount / 100).toFixed(2)} ${d.currency.toUpperCase()}` + (d.email ? ` · Chek: ${d.email}` : "");
        } else {
          document.getElementById("title").textContent = "To'lov yakunlanmadi";
          document.getElementById("msg").textContent = d.error || "Holat: " + d.status;
        }
      })
      .catch(() => (document.getElementById("title").textContent = "Holatni tekshirib bo'lmadi"));
  </script>
</body>
</html>
