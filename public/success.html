<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To'lov natijasi — Elektro Market</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .box { max-width: 480px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 32px; text-align: center; }
    .box h1 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">Tekshirilmoqda…</h1>
    <p id="msg" class="muted"></p>
    <a href="/" class="primary" style="display:inline-block;text-decoration:none;margin-top:12px">Do'konga qaytish</a>
  </div>
  <script>
    const som = (n) => Math.round(n).toLocaleString("ru-RU").replace(/,/g, " ") + " so'm";
    const id = new URLSearchParams(location.search).get("order");
    const $ = (s) => document.getElementById(s);
    fetch("/api/orders/" + encodeURIComponent(id || ""))
      .then((r) => r.json())
      .then((d) => {
        if (d.status === "paid") {
          localStorage.removeItem("cart");
          $("title").textContent = "✅ To'lov muvaffaqiyatli!";
          $("msg").textContent = `Buyurtma ${d.order_id} · ${som(d.amount_uzs)} · karta ${d.card}`;
        } else {
          $("title").textContent = "To'lov yakunlanmadi";
          $("msg").textContent = d.error || "Holat: " + d.status;
        }
      })
      .catch(() => ($("title").textContent = "Holatni tekshirib bo'lmadi"));
  </script>
</body>
</html>
